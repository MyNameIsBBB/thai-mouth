[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thaimouth"
version = "0.1.0"
description = "Thai-native conversational and reasoning language models with recurrent latent compute."
readme = "README.md"
authors = [{ name = "ThaiMouth Research Team" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "tokenizers>=0.15.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "safetensors>=0.4.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
