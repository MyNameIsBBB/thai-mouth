model:
  model_type: "latent"
  vocab_size: 4096
  d_model: 144
  n_heads: 4
  d_ff: 576
  input_layers: 1
  think_layers: 1
  recurrent_steps: 2
  max_seq_len: 256
  dropout: 0.05
  latent_alpha: 1.0
  tie_word_embeddings: true
  norm_type: "rmsnorm"

training:
  batch_size: 32
  grad_accum_steps: 2
  learning_rate: 0.0006
  min_lr: 0.00006
  weight_decay: 0.01
  warmup_steps: 80
  max_epochs: 8
  eval_interval: 100
  eval_batches: 20
  save_interval: 500
  grad_clip: 1.0
  mixed_precision: true
  device: "auto"
  seed: 42
  output_dir: "checkpoints/model_b_curriculum_1_2_4"
  # Model B: Stochastic depth sampling across {1, 2, 4}
  curriculum:
    - progress: 0.3
      steps: [1]
    - progress: 0.6
      steps: [1, 2]
    - progress: 1.0
      steps: [1, 2, 4]

data:
  train_path: "data/synthetic/train.jsonl"
  val_path: "data/synthetic/val.jsonl"
  test_path: "data/synthetic/test.jsonl"
  tokenizer_path: "checkpoints/tokenizer.json"
  max_seq_len: 256
