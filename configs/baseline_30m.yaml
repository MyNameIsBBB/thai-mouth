model:
  model_type: "baseline"
  vocab_size: 8192
  d_model: 512
  n_heads: 8
  d_ff: 2048
  n_layers: 12
  max_seq_len: 512
  dropout: 0.1
  tie_word_embeddings: true
  norm_type: "rmsnorm"

training:
  batch_size: 32
  grad_accum_steps: 4
  learning_rate: 0.0003
  min_lr: 0.00003
  weight_decay: 0.01
  warmup_steps: 200
  max_epochs: 20
  eval_interval: 200
  eval_batches: 50
  save_interval: 1000
  grad_clip: 1.0
  mixed_precision: true
  device: "auto"
  seed: 42
  output_dir: "checkpoints/baseline_30m"

data:
  train_path: "data/processed/train.jsonl"
  val_path: "data/processed/val.jsonl"
  test_path: "data/processed/test.jsonl"
  tokenizer_path: "checkpoints/tokenizer_8k.json"
  max_seq_len: 512
